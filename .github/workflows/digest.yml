name: Digest Insper

on:
  schedule:
    # 11:00 UTC = 08:00 horário de Brasília (sem horário de verão), nos dias 5, 10, 15, 20, 25 e 30
    - cron: "0 11 5,10,15,20,25,30 * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: read

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - run: node index.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
          DIGEST_EMAIL_FROM: ${{ secrets.DIGEST_EMAIL_FROM }}
          GITHUB_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIN_SCORE: ${{ vars.MIN_SCORE }}
          SEND_EMPTY_DIGEST: ${{ vars.SEND_EMPTY_DIGEST }}

      - name: Persistir cache e logs
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add data/ logs/
          git diff --staged --quiet || git commit -m "chore: atualiza digest e cache [skip ci]"
          git push
